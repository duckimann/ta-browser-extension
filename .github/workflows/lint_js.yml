name: lint_js

on: [pull_request, push]

jobs:
  check:
    name: lint_js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check 'extension/**/*.js'
